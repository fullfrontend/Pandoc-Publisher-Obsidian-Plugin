name: Bug report
description: Report a reproducible, non-sensitive defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not include private Vault content, client branding assets, credentials,
        or security vulnerabilities. Follow SECURITY.md for sensitive reports.
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a neutral example without private files or branding.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Redact usernames, local paths, and document contents.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed private content and local identifying information.
          required: true
        - label: This is not a security vulnerability.
          required: true

